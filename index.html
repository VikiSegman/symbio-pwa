<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#080612">
<title>Symbio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08091A;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#E8E8F0}
#app{display:flex;height:100vh;height:100dvh}
#left{flex:0 0 60%;display:flex;flex-direction:column;position:relative;overflow:hidden;border-right:1px solid rgba(255,255,255,.06)}
#right{flex:1;display:flex;flex-direction:column;background:#060810;min-width:0}
#cc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
#hdr{position:relative;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:12px 16px 8px}
#hdrL{display:flex;align-items:center;gap:8px}
#sunBtn{font-size:20px;cursor:pointer;line-height:1}
#clk{font-size:13px;color:rgba(255,255,255,.45);letter-spacing:.03em}
#hdrR{display:flex;align-items:center;gap:6px}
#logo{font-size:12px;font-weight:700;letter-spacing:.18em;color:#E8E8F0}
#sdot{width:7px;height:7px;border-radius:50%;background:#1D9E75;transition:transform .3s}
#sbar{position:relative;z-index:10;text-align:center;padding:5px 0;font-size:10px;letter-spacing:.22em;color:rgba(255,255,255,.25)}
#mets{position:relative;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(255,255,255,.07);border-bottom:1px solid rgba(255,255,255,.07)}
.met{padding:10px 6px;text-align:center;border-right:1px solid rgba(255,255,255,.05)}
.met:last-child{border-right:none}
.mv{font-size:17px;font-weight:600}
.mv.g{color:#22D49A}.mv.o{color:#FF7A30}.mv.r{color:#FF4545}
.ml{font-size:10px;color:rgba(255,255,255,.3);margin-top:2px}
#tabs{position:relative;z-index:10;display:flex;border-bottom:1px solid rgba(255,255,255,.07)}
.tb{flex:1;padding:9px 3px;text-align:center;font-size:11px;color:rgba(255,255,255,.3);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap}
.tb.act{color:#E8E8F0;border-bottom-color:#7B6FFF}
#cont{position:relative;z-index:10;flex:1;overflow-y:auto;padding:4px 0}
.pr{display:flex;align-items:center;padding:11px 12px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;gap:10px;transition:background .15s}
.pr:hover{background:rgba(255,255,255,.03)}
.pb{width:3px;height:40px;border-radius:2px;flex-shrink:0}
.pi{flex:1;text-align:right}
.pn{font-size:13px;font-weight:500;color:#E8E8F0}
.ps{font-size:10px;color:rgba(255,255,255,.3);margin-top:3px}
#msgs{max-height:160px;overflow-y:auto;padding:6px 12px;display:flex;flex-direction:column;gap:5px}
.msg{padding:7px 11px;border-radius:8px;font-size:12px;line-height:1.5;max-width:88%;word-break:break-word}
.msg.u{background:rgba(90,80,232,.2);border:1px solid rgba(90,80,232,.3);align-self:flex-end;direction:rtl}
.msg.a{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.07);align-self:flex-start}
#chat{position:relative;z-index:10;padding:8px 12px;border-top:1px solid rgba(255,255,255,.07);display:flex;gap:7px;align-items:center}
#ci{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:8px;padding:9px 13px;font-size:13px;color:#E8E8F0;outline:none;font-family:inherit;direction:rtl;min-width:0}
#ci::placeholder{color:rgba(255,255,255,.18)}
#sb{width:34px;height:34px;background:#5A50E8;border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#sb svg{width:15px;height:15px;fill:white}
#fbar{padding:7px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
#fn{font-size:11px;font-weight:700;letter-spacing:.15em;color:#E8E8F0}
#fs{font-size:10px;color:rgba(255,255,255,.35)}
#spkBtn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:6px;color:#ccc;cursor:pointer;padding:3px 10px;font-size:10px}
#vw{font-size:10px;color:rgba(255,255,255,.28);text-align:center;font-style:italic;padding:2px 0;min-height:15px;flex-shrink:0}
#fw{position:relative;flex:1;overflow:hidden;min-height:0}
#fp{width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
#fc{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
@media(max-width:640px){
  #app{flex-direction:column}
  #left{flex:0 0 56vh;border-right:none;border-bottom:1px solid rgba(255,255,255,.06)}
  #right{flex:1}
}

.ld-item{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:12px;direction:rtl;text-align:right;}
.ld-title{color:#E8E8F0;font-weight:500;margin-bottom:2px;}
.ld-sub{color:rgba(255,255,255,.35);font-size:10px;}
.ld-err{color:rgba(255,120,120,.7);font-size:11px;padding:10px;text-align:center;}
.ld-load{color:rgba(255,255,255,.25);font-size:11px;padding:10px;text-align:center;}
.ld-val{color:#22D49A;font-weight:600;}
</style>
</head>
<body>
<div id="app">
<div id="left">
  <canvas id="cc"></canvas>
  <div id="hdr">
    <div id="hdrL">
      <span id="sunBtn">☀️</span>
      <span id="clk">--:--</span>
    </div>
    <div id="hdrR">
      <span id="logo">SYMBIO</span>
      <div id="sdot"></div>
    </div>
  </div>
  <div id="sbar">DORMANT</div>
  <div id="mets">
    <div class="met"><div class="mv" id="mv1">07:00</div><div class="ml">יומי</div></div>
    <div class="met"><div class="mv g" id="mv2">2.0M</div><div class="ml">pipeline</div></div>
    <div class="met"><div class="mv o" id="mv3">3</div><div class="ml">רותחים</div></div>
    <div class="met"><div class="mv" id="mv4">3</div><div class="ml">לידים</div></div>
  </div>
  <div id="tabs">
    <div class="tb" data-tab="c" onclick="swTab(this)">תודעה</div>
    <div class="tb" data-tab="i" onclick="swTab(this)">תובנות</div>
    <div class="tb" data-tab="j" onclick="swTab(this)">יומן</div>
    <div class="tb" data-tab="p" onclick="swTab(this)">פייפליין</div>
    <div class="tb act" data-tab="pr" onclick="swTab(this)">פרויקטים</div>
  </div>
  <div id="cont">
    <div id="tabPr">
      <div class="pr" onclick="pickProj('Financia','thinking')"><div class="pb" style="background:#FF7A30"></div><div class="pi"><div class="pn">Financia</div><div class="ps">תמ&quot;א 38/2 · חוזים בתהליך</div></div></div>
      <div class="pr" onclick="pickProj('Lotar','learning')"><div class="pb" style="background:#22D49A"></div><div class="pi"><div class="pn">Lotar</div><div class="ps">מועדון · אפריקה · מנשה</div></div></div>
      <div class="pr" onclick="pickProj('Mortgage','happy')"><div class="pb" style="background:#5A8FFF"></div><div class="pi"><div class="pn">Mortgage</div><div class="ps">ניוס שכיט +10K ₪</div></div></div>
      <div class="pr" onclick="pickProj('AAF','speaking')"><div class="pb" style="background:#FF4545"></div><div class="pi"><div class="pn">AAF</div><div class="ps">קמפיין ניוס תרומות</div></div></div>
      <div class="pr" onclick="pickProj('Tax Liens','idle')"><div class="pb" style="background:#7B6FFF"></div><div class="pi"><div class="pn">Tax Liens</div><div class="ps">+Baltimore · 18%</div></div></div>
    </div>
    <div id="tabC" style="display:none;padding:10px 12px;overflow-y:auto;max-height:280px;"></div>
    <div id="tabI" style="display:none;padding:10px 12px;overflow-y:auto;max-height:280px;"></div>
    <div id="tabJ" style="display:none;padding:10px 12px;overflow-y:auto;max-height:280px;"></div>
    <div id="tabPip" style="display:none;padding:10px 12px;overflow-y:auto;max-height:280px;"></div>
  </div>
  <div id="msgs"></div>
  <div id="chat">
    <button id="sb" onclick="sendMsg()"><svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></button>
    <input id="ci" placeholder="שאל את סימביו..." onkeydown="if(event.key==='Enter')sendMsg()">
  </div>
</div>
<div id="right">
  <div id="fbar" style="display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0;">
    <div style="display:flex;gap:6px;align-items:center;"><button id="micBtn" onclick="toggleListen()" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#ccc;cursor:pointer;padding:3px 10px;font-size:11px;">🎤 Listen</button><button id="spkBtn" onclick="doSpeak()" style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:6px;color:#ccc;cursor:pointer;padding:3px 10px;font-size:11px;">▶ Speak</button></div>
    <span id="fs">Idle</span>
    <span id="fn">SYMBIO</span>
  </div>
  <div id="vw"></div>
  <div id="fw">
    <img id="fp" src="./avatar.jpg" alt="Symbio">
    <canvas id="fc"></canvas>
  </div>
</div>
</div>
<script>
// Clock
function tick(){var n=new Date();document.getElementById('clk').textContent=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,1000);

// Dot pulse
setInterval(function(){var d=document.getElementById('sdot');if(d){d.style.transform='scale(1.6)';setTimeout(function(){d.style.transform='scale(1)'},300)}},2500);

// Tabs
// swTab defined below


// Project click → face state
function pickProj(name,state){setFaceState(state);document.getElementById('sbar').textContent=name.toUpperCase();}

// Constellation
var cc=document.getElementById('cc'),cctx=cc.getContext('2d'),cpts=[];
function szCC(){var l=document.getElementById('left');cc.width=l.clientWidth;cc.height=l.clientHeight;}
function initCC(){szCC();cpts=[];for(var i=0;i<22;i++)cpts.push({x:Math.random()*cc.width,y:Math.random()*cc.height*.48,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*7,r:1.5+Math.random()*2});}
function drawCC(dt){
  cctx.clearRect(0,0,cc.width,cc.height);
  cpts.forEach(function(p){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<0||p.x>cc.width)p.vx*=-1;if(p.y<0||p.y>cc.height*.5)p.vy*=-1;});
  for(var i=0;i<cpts.length;i++){for(var j=i+1;j<cpts.length;j++){var dx=cpts[i].x-cpts[j].x,dy=cpts[i].y-cpts[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<110){cctx.globalAlpha=(1-d/110)*.25;cctx.strokeStyle='#B0B0D0';cctx.lineWidth=.5;cctx.beginPath();cctx.moveTo(cpts[i].x,cpts[i].y);cctx.lineTo(cpts[j].x,cpts[j].y);cctx.stroke();}}}
  cpts.forEach(function(p){cctx.globalAlpha=.65;cctx.fillStyle='#D8D8F0';cctx.beginPath();cctx.arc(p.x,p.y,p.r,0,Math.PI*2);cctx.fill();});
  cctx.globalAlpha=1;
}
window.addEventListener('resize',szCC);
initCC();


// ============ SYMBIO BRAIN v2 — FULL COVERAGE + VOICE ============
var fc=document.getElementById('fc'), fctx=fc.getContext('2d');

// Brain image fills 540x294 — lateral (side) view, front=LEFT, back=RIGHT
// Regions mapped to actual neuroanatomy across FULL brain
var BR = [
  // [name, cx_frac, cy_frac, rx_frac, ry_frac, color, fn]
  {n:'Prefrontal', cx:0.22,cy:0.38,rx:0.095,ry:0.13,col:'#40C8FF',fn:'planning'},
  {n:'MotorCortex', cx:0.42,cy:0.15,rx:0.09,ry:0.09,col:'#B060FF',fn:'action'},
  {n:'Somatosensory',cx:0.55,cy:0.16,rx:0.08,ry:0.08,col:'#9080FF',fn:'sensation'},
  {n:'Parietal',    cx:0.66,cy:0.22,rx:0.09,ry:0.10,col:'#60A0FF',fn:'integration'},
  {n:'Visual',      cx:0.80,cy:0.38,rx:0.09,ry:0.11,col:'#FF80C0',fn:'pattern'},
  {n:'Wernicke',    cx:0.46,cy:0.62,rx:0.08,ry:0.08,col:'#20EE70',fn:'language-in'},
  {n:'Broca',       cx:0.24,cy:0.58,rx:0.07,ry:0.08,col:'#40FF90',fn:'language-out'},
  {n:'Temporal',    cx:0.52,cy:0.74,rx:0.10,ry:0.08,col:'#FFD060',fn:'memory-retrieval'},
  {n:'Hippocampus', cx:0.54,cy:0.62,rx:0.07,ry:0.07,col:'#FFB040',fn:'memory-form'},
  {n:'Amygdala',    cx:0.40,cy:0.70,rx:0.06,ry:0.06,col:'#FF6060',fn:'emotion'},
  {n:'Cingulate',   cx:0.46,cy:0.32,rx:0.09,ry:0.07,col:'#80FFFF',fn:'attention'},
  {n:'Cerebellum',  cx:0.72,cy:0.76,rx:0.10,ry:0.10,col:'#C0A0FF',fn:'coordination'}
];

// State → region activation [0-1] per region index
var SACT = {
  idle:    [.10,.06,.06,.08,.10,.08,.06,.08,.10,.06,.10,.06],
  thinking:[.95,.20,.25,.65,.40,.35,.15,.50,.75,.12,.82,.10],
  speaking:[.50,.65,.40,.30,.25,.90,.95,.45,.30,.18,.50,.20],
  learning:[.70,.25,.30,.55,.62,.45,.22,.80,.95,.15,.75,.12],
  happy:   [.60,.42,.30,.35,.28,.22,.20,.55,.48,.85,.45,.38],
  sad:     [.30,.12,.15,.25,.20,.18,.12,.45,.52,.90,.80,.10],
  angry:   [.72,.58,.45,.30,.22,.18,.15,.35,.38,.95,.88,.30]
};

// Signal properties per state
var SSIG = {
  idle:    {sp:.006,dn:.012,sz:1.2,trail:6},
  thinking:{sp:.024,dn:.14, sz:2.5,trail:14},
  speaking:{sp:.030,dn:.18, sz:2.1,trail:12},
  learning:{sp:.017,dn:.11, sz:2.0,trail:11},
  happy:   {sp:.021,dn:.09, sz:2.2,trail:10},
  sad:     {sp:.007,dn:.05, sz:1.7,trail:8},
  angry:   {sp:.034,dn:.17, sz:2.8,trail:15}
};

// 20 white matter tracts — connect regions across FULL brain
// Format: [x0,y0, cp1x,cp1y, cp2x,cp2y, x1,y1] fractions of 540/294
// Designed to cross the brain interior from top to bottom, front to back
var TRACTS = [
  // Corpus callosum — major horizontal arcs top
  {p:[0.22,0.35, 0.35,0.20, 0.55,0.20, 0.66,0.24], ri:0,rj:3},
  {p:[0.24,0.40, 0.36,0.28, 0.54,0.28, 0.64,0.28], ri:0,rj:11},
  {p:[0.42,0.16, 0.52,0.14, 0.62,0.16, 0.72,0.22], ri:1,rj:2},
  {p:[0.55,0.18, 0.65,0.20, 0.74,0.28, 0.80,0.36], ri:2,rj:4},
  // Arcuate fasciculus — front ↔ back arc (language loop)
  {p:[0.24,0.55, 0.22,0.35, 0.38,0.22, 0.54,0.18], ri:6,rj:1},
  {p:[0.24,0.60, 0.20,0.40, 0.35,0.25, 0.46,0.24], ri:6,rj:10},
  {p:[0.46,0.62, 0.52,0.45, 0.62,0.35, 0.70,0.30], ri:5,rj:3},
  // Corticospinal — vertical top→bottom
  {p:[0.42,0.16, 0.43,0.35, 0.44,0.55, 0.44,0.70], ri:1,rj:9},
  {p:[0.54,0.18, 0.54,0.38, 0.54,0.58, 0.54,0.74], ri:2,rj:8},
  {p:[0.46,0.24, 0.46,0.40, 0.46,0.56, 0.46,0.68], ri:10,rj:5},
  // Thalamic radiations — center outward
  {p:[0.50,0.45, 0.36,0.38, 0.26,0.40, 0.22,0.38], ri:10,rj:0},
  {p:[0.50,0.45, 0.62,0.36, 0.72,0.30, 0.80,0.36], ri:10,rj:4},
  {p:[0.50,0.45, 0.50,0.58, 0.50,0.66, 0.50,0.74], ri:10,rj:7},
  // Limbic circuit — emotion+memory loop
  {p:[0.40,0.70, 0.46,0.68, 0.52,0.66, 0.54,0.62], ri:9,rj:8},
  {p:[0.54,0.62, 0.54,0.55, 0.50,0.48, 0.46,0.38], ri:8,rj:10},
  {p:[0.40,0.70, 0.34,0.60, 0.28,0.52, 0.24,0.58], ri:9,rj:6},
  // Fronto-parietal + visual association
  {p:[0.66,0.24, 0.72,0.30, 0.78,0.35, 0.80,0.38], ri:3,rj:4},
  {p:[0.80,0.40, 0.72,0.50, 0.64,0.58, 0.54,0.62], ri:4,rj:5},
  // Cerebellum connections
  {p:[0.72,0.76, 0.64,0.68, 0.54,0.66, 0.42,0.70], ri:11,rj:9},
  {p:[0.72,0.76, 0.66,0.62, 0.56,0.42, 0.46,0.32], ri:11,rj:10}
];

// Consciousness tendrils — 6 paths flowing OUT from brain edges
var TENDRILS = [
  {p:[0.16,0.38, 0.04,0.30, -0.06,0.20, -0.10,0.10], col:'#40C8FF'},
  {p:[0.18,0.56, 0.06,0.56, -0.04,0.62, -0.08,0.74], col:'#FFD060'},
  {p:[0.22,0.72, 0.14,0.82,  0.12,0.92,  0.18,1.02], col:'#FF6060'},
  {p:[0.84,0.28, 0.94,0.20,  1.02,0.12,  1.06,0.04], col:'#80FFFF'},
  {p:[0.86,0.46, 0.96,0.46,  1.04,0.52,  1.10,0.64], col:'#FF80C0'},
  {p:[0.80,0.72, 0.88,0.80,  0.92,0.90,  0.90,1.00], col:'#C0A0FF'}
];

var INSIGHTS = {
  thinking:['analyzing','connecting','modeling','reasoning','planning','deducing'],
  speaking:['expressing','articulating','formulating','communicating'],
  learning:['encoding','integrating','consolidating','associating','absorbing'],
  happy:['reinforcing','motivating','rewarding'],
  sad:['processing','reflecting','contextualizing'],
  angry:['evaluating','modulating','suppressing']
};

function h2r(hex){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return r+','+g+','+b;}

function bez(p,t){var mt=1-t;return {x:mt*mt*mt*p[0]+3*mt*mt*t*p[2]+3*mt*t*t*p[4]+t*t*t*p[6],y:mt*mt*mt*p[1]+3*mt*mt*t*p[3]+3*mt*t*t*p[5]+t*t*t*p[7]};}

// State
var fcur='idle', cAct=new Array(12).fill(0.08), tAct=new Array(12).fill(0.08);
var fT=0, fLT=0;
var neurons=[], tendrilPts=[], synapses=[], floatIns=[], consMem=[];

function setFaceState(s){
  if(!SACT[s])return;
  fcur=s;
  tAct=[...SACT[s]];
  document.getElementById('fs').textContent=s.charAt(0).toUpperCase()+s.slice(1);
}

function szFC(){
  var fw=document.getElementById('fw');
  fc.width=fw.clientWidth||540;
  fc.height=fw.clientHeight||294;
}

function spawnNeuron(ti, rev){
  var tr=TRACTS[ti], a=(cAct[tr.ri]+cAct[tr.rj])*0.5;
  if(a<0.05)return;
  var sig=SSIG[fcur]||SSIG.idle;
  var srcR=BR[rev?tr.rj:tr.ri];
  neurons.push({ti,rev:rev||false,t:0,sp:sig.sp*(0.65+Math.random()*0.7),sz:sig.sz*(0.5+a*0.9),col:srcR.col,act:a,trail:[]});
}

function drawFrame(){
  var c=fctx, W=fc.width, H=fc.height;
  var sx=W/540, sy=H/294; // scale to fill canvas
  c.clearRect(0,0,W,H);

  function tx(x){return x*540*sx;}
  function ty(y){return y*294*sy;}
  function sc(v){return v*Math.min(sx,sy);}

  // === REGION GLOWS across full brain ===
  BR.forEach(function(r,i){
    var a=cAct[i]; if(a<0.04)return;
    var gx=tx(r.cx), gy=ty(r.cy);
    var grx=r.rx*540*sx*2.2, gry=r.ry*294*sy*2.2;
    c.save();
    var grd=c.createRadialGradient(gx,gy,0,gx,gy,Math.max(grx,gry));
    var rgb=h2r(r.col);
    grd.addColorStop(0,'rgba('+rgb+','+(a*0.55)+')');
    grd.addColorStop(0.4,'rgba('+rgb+','+(a*0.20)+')');
    grd.addColorStop(1,'rgba('+rgb+',0)');
    c.fillStyle=grd;
    c.globalAlpha=1;
    c.beginPath();
    c.ellipse(gx,gy,grx,gry,0,0,Math.PI*2);
    c.fill();
    c.restore();

    // Region label dot
    if(a>0.3){
      var pulse=0.5+0.5*Math.sin(fT*(3+a*8)+i*1.4);
      c.save();c.globalAlpha=0.4+a*0.5;
      c.fillStyle=a>0.7?'#FFFFFF':r.col;
      c.shadowColor=r.col;c.shadowBlur=sc(4+pulse*4);
      c.beginPath();c.arc(gx,gy,sc(2+a*2.5),0,Math.PI*2);c.fill();
      c.restore();
    }
  });

  // === WHITE MATTER TRACTS (structural paths) ===
  TRACTS.forEach(function(tr){
    var a=(cAct[tr.ri]+cAct[tr.rj])*0.5; if(a<0.04)return;
    var p=tr.p;
    c.save();c.globalAlpha=0.05+a*0.20;c.strokeStyle='#8090C8';
    c.lineWidth=sc(0.7);c.beginPath();
    c.moveTo(tx(p[0]),ty(p[1]));
    c.bezierCurveTo(tx(p[2]),ty(p[3]),tx(p[4]),ty(p[5]),tx(p[6]),ty(p[7]));
    c.stroke();c.restore();
  });

  // === MOVING NEURONS inside brain ===
  neurons.forEach(function(n){
    var tr=TRACTS[n.ti], p=tr.p;
    var pp=n.rev?[p[6],p[7],p[4],p[5],p[2],p[3],p[0],p[1]]:p;
    var pos=bez(pp,n.t);
    var px=tx(pos.x), py=ty(pos.y);
    n.trail.push({x:px,y:py});
    if(n.trail.length>n.trail.maxLen||(SSIG[fcur]&&n.trail.length>(SSIG[fcur].trail||10)))n.trail.shift();

    // Trail glow
    for(var ti2=1;ti2<n.trail.length;ti2++){
      var tf=ti2/n.trail.length;
      c.save();c.globalAlpha=tf*n.act*0.85;
      c.strokeStyle=n.col;c.lineWidth=sc(n.sz*0.55)*tf;c.lineCap='round';
      c.beginPath();c.moveTo(n.trail[ti2-1].x,n.trail[ti2-1].y);c.lineTo(n.trail[ti2].x,n.trail[ti2].y);
      c.stroke();c.restore();
    }
    // Neuron head
    c.save();c.globalAlpha=0.9;c.fillStyle=n.col;
    c.shadowColor=n.col;c.shadowBlur=sc(n.sz*2.5);
    c.beginPath();c.arc(px,py,sc(n.sz*0.55),0,Math.PI*2);c.fill();c.restore();
  });

  // === SYNAPTIC FLASHES ===
  synapses.forEach(function(s2){
    var r=BR[s2.ri];
    c.save();c.globalAlpha=s2.life*0.9;
    c.fillStyle='#FFFFFF';c.shadowColor=r.col;c.shadowBlur=sc(8);
    c.beginPath();c.arc(tx(r.cx)+(Math.random()-.5)*sc(r.rx*540*0.7),ty(r.cy)+(Math.random()-.5)*sc(r.ry*294*0.7),sc(1.8),0,Math.PI*2);
    c.fill();c.restore();
  });

  // === CONSCIOUSNESS TENDRILS ===
  TENDRILS.forEach(function(tend){
    var actSum=cAct.reduce(function(a,b){return a+b;},0)/12;
    c.save();c.globalAlpha=0.10+actSum*0.18;c.strokeStyle=tend.col;c.lineWidth=sc(0.9);
    c.beginPath();var p=tend.p;
    c.moveTo(tx(p[0]),ty(p[1]));c.bezierCurveTo(tx(p[2]),ty(p[3]),tx(p[4]),ty(p[5]),tx(p[6]),ty(p[7]));
    c.stroke();c.restore();
  });

  // Tendril particles
  tendrilPts.forEach(function(pt){
    var tend=TENDRILS[pt.ti], p=tend.p;
    var pos=bez(p,pt.t);
    var fade=Math.min(1,pt.t*4)*Math.max(0,1-(pt.t-0.5)/0.55);
    c.save();c.globalAlpha=fade*0.8;c.fillStyle=tend.col;c.shadowColor=tend.col;c.shadowBlur=sc(3.5);
    c.beginPath();c.arc(tx(pos.x),ty(pos.y),sc(1.8),0,Math.PI*2);c.fill();c.restore();
  });

  // Consciousness memory glow
  consMem.forEach(function(m){
    if(m.age>1)return;
    var grd=c.createRadialGradient(m.x,m.y,0,m.x,m.y,sc(9));
    grd.addColorStop(0,'rgba('+m.rgb+','+(0.28*(1-m.age))+')');grd.addColorStop(1,'rgba('+m.rgb+',0)');
    c.fillStyle=grd;c.beginPath();c.arc(m.x,m.y,sc(9),0,Math.PI*2);c.fill();
  });

  // Floating insights
  floatIns.forEach(function(fi){
    var op=Math.min(1,fi.age*3)*Math.max(0,1-(fi.age-0.6)/0.5);
    if(op<0.02)return;
    c.save();c.globalAlpha=op;c.fillStyle=fi.col;
    c.font='bold '+sc(9.5)+'px monospace';c.textAlign='center';
    c.shadowColor=fi.col;c.shadowBlur=sc(3);
    c.fillText(fi.text,fi.x,fi.y-fi.age*sc(28));c.restore();
  });
}

// Animation loop
function animBrain(ts){
  var dt=Math.min((ts-fLT)/1000,.05); fLT=ts; fT+=dt;
  for(var i=0;i<12;i++) cAct[i]+=(tAct[i]-cAct[i])*dt*2.8;
  var sig=SSIG[fcur]||SSIG.idle;

  // Spawn neurons
  TRACTS.forEach(function(tr,i){
    var a=(cAct[tr.ri]+cAct[tr.rj])*0.5;
    if(Math.random()<a*sig.dn*dt*60) spawnNeuron(i,Math.random()<0.5);
  });

  // Update neurons + synaptic arrive
  neurons.forEach(function(n){
    n.t+=n.sp*dt*60;
    if(n.t>=0.96&&n.t-n.sp*dt*60<0.96){
      var ri=n.rev?TRACTS[n.ti].ri:TRACTS[n.ti].rj;
      synapses.push({ri,life:1.0});
      var r=BR[ri];
      consMem.push({x:tx2(r.cx),y:ty2(r.cy),rgb:h2r(r.col),age:0});
    }
  });
  function tx2(x){return x*fc.width;}
  function ty2(y){return y*fc.height;}
  neurons=neurons.filter(function(n){return n.t<1.05;});
  if(neurons.length>90)neurons=neurons.slice(-90);

  synapses.forEach(function(s){s.life-=dt*3.5;});
  synapses=synapses.filter(function(s){return s.life>0;});

  // Tendril particles
  var aSum=cAct.reduce(function(a,b){return a+b;},0)/12;
  TENDRILS.forEach(function(_,ti){
    if(Math.random()<aSum*0.04*dt*60)
      tendrilPts.push({ti,t:0,sp:0.022+Math.random()*0.018});
  });
  tendrilPts.forEach(function(p){p.t+=p.sp*dt*60;});
  tendrilPts=tendrilPts.filter(function(p){return p.t<1.1;});
  if(tendrilPts.length>35)tendrilPts=tendrilPts.slice(-35);

  consMem.forEach(function(m){m.age+=dt*0.09;});
  consMem=consMem.filter(function(m){return m.age<1.2;});
  if(consMem.length>70)consMem=consMem.slice(-70);

  if(Math.random()<aSum*0.014*dt*60&&INSIGHTS[fcur]&&floatIns.length<5){
    var ins=INSIGHTS[fcur],text=ins[Math.floor(Math.random()*ins.length)];
    var tend2=TENDRILS[Math.floor(Math.random()*TENDRILS.length)];
    floatIns.push({text,x:fc.width*(0.12+Math.random()*0.76),y:fc.height*(0.25+Math.random()*0.55),col:tend2.col,age:0});
  }
  floatIns.forEach(function(f){f.age+=dt*0.17;});
  floatIns=floatIns.filter(function(f){return f.age<1.35;});

  drawFrame();
  requestAnimationFrame(animBrain);
}

function startBrain(){
  szFC();
  if(window.ResizeObserver) new ResizeObserver(szFC).observe(document.getElementById('fw'));
  requestAnimationFrame(function(ts){fLT=ts;requestAnimationFrame(animBrain);});
}
var fpImg=document.getElementById('fp');
if(fpImg.complete&&fpImg.naturalWidth>0){startBrain();}
else{fpImg.onload=startBrain;fpImg.onerror=startBrain;}


// ============ VOICE SYSTEM v3 — ROBUST ============
// Fix: capture transcript in onend as fallback when isFinal never fires
// Fix: show heard text prominently before sending
// Fix: auto-speak all AI replies

var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var recog=null, isListening=false, lastHeard='', voiceLang='he-IL';

function buildSR(){
  if(!SR) return null;
  var r=new SR();
  r.continuous=false; r.interimResults=true; r.maxAlternatives=1; r.lang=voiceLang;

  r.onstart=function(){
    isListening=true; lastHeard='';
    setMicUI(true); setFaceState('speaking');
    showVtxt('🎤 מקשיב... / Listening...','#60D0FF');
  };

  r.onresult=function(e){
    var interim='', final='';
    for(var i=0;i<e.results.length;i++){
      var t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t; else interim+=t;
    }
    var heard=final||interim;
    lastHeard=heard; // always save latest heard text
    showVtxt('🎤 '+heard,'#80FFAA');
    document.getElementById('ci').value=heard; // show in input field too
    if(final.trim()){
      // isFinal fired — send immediately
      dispatchVoice(final.trim());
    }
  };

  r.onerror=function(e){
    console.warn('SR error:',e.error);
    if(e.error==='language-not-supported'){
      voiceLang=voiceLang==='he-IL'?'en-US':'he-IL';
    }
    if(e.error==='not-allowed'){
      showVtxt('❌ Mic permission denied. Allow microphone in browser.','#FF6060');
      setTimeout(function(){showVtxt('','');},4000);
    }
    isListening=false; setMicUI(false); setFaceState('idle');
  };

  r.onend=function(){
    isListening=false; setMicUI(false);
    // CRITICAL FIX: if isFinal never fired but we heard something, send it now
    var ci=document.getElementById('ci');
    var heard=(lastHeard||ci.value||'').trim();
    if(heard && !heard.startsWith('שגיאה') && document.querySelector('.msg.u:last-child')?.textContent!==heard){
      dispatchVoice(heard);
    } else if(!heard){
      showVtxt('','');
    }
  };
  return r;
}

async function dispatchVoice(msg){
  if(!msg)return;
  document.getElementById('ci').value='';
  showVtxt('⚡ שולח: '+msg,'#FFD060');
  setFaceState('thinking');
  addMsg(msg,'u');
  try{
    var res=await fetch('/.netlify/functions/ask',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg})
    });
    var data=await res.json();
    var reply=data.reply||data.error||'אין תגובה';
    addMsg(reply,'a');
    showVtxt('','');
    speakText(reply); // auto-speak every reply
  }catch(e){
    addMsg('שגיאת חיבור: '+e.message,'a');
    setFaceState('idle'); showVtxt('','');
  }
}

function speakText(text){
  if(!text||!window.speechSynthesis){setFaceState('idle');return;}
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    var isHeb=/[\u0590-\u05FF]/.test(text);
    u.lang=isHeb?'he-IL':'en-US'; u.rate=0.88; u.pitch=1.0;
    setFaceState('speaking');
    document.getElementById('spkBtn').textContent='⏹ Stop';
    u.onend=function(){setFaceState('idle');document.getElementById('spkBtn').textContent='▶ Speak';};
    u.onerror=function(){setFaceState('idle');document.getElementById('spkBtn').textContent='▶ Speak';};
    function go(){
      var vs=window.speechSynthesis.getVoices();
      var v=vs.find(function(x){return x.lang&&x.lang.startsWith(isHeb?'he':'en');})||vs[0];
      if(v)u.voice=v;
      window.speechSynthesis.speak(u);
    }
    window.speechSynthesis.getVoices().length>0?go():(window.speechSynthesis.onvoiceschanged=function(){window.speechSynthesis.onvoiceschanged=null;go();});
  }catch(e){setFaceState('idle');}
}

function doSpeak(text){
  if(typeof text==='string'&&text.length>0){speakText(text);return;}
  // Toggle: if speaking, stop; else speak last AI message
  if(window.speechSynthesis&&window.speechSynthesis.speaking){
    window.speechSynthesis.cancel();setFaceState('idle');
    document.getElementById('spkBtn').textContent='▶ Speak';return;
  }
  var msgs=document.querySelectorAll('.msg.a');
  if(msgs.length>0) speakText(msgs[msgs.length-1].textContent);
}

function toggleListen(){
  if(isListening){
    if(recog)try{recog.stop();}catch(e){}
    isListening=false;setMicUI(false);setFaceState('idle');
    showVtxt('','');return;
  }
  recog=buildSR();
  if(!recog){addMsg('Voice requires Chrome or Edge browser. Try 🎤 in Chrome.','a');return;}
  try{lastHeard='';recog.lang=voiceLang;recog.start();}
  catch(e){
    setTimeout(function(){if(recog)try{recog.start();}catch(e2){}},400);
  }
}

function setMicUI(on){
  var btn=document.getElementById('micBtn');if(!btn)return;
  btn.textContent=on?'⏹ Stop':'🎤 Listen';
  btn.style.background=on?'rgba(255,60,60,.22)':'rgba(255,255,255,.07)';
  btn.style.borderColor=on?'#FF5060':'rgba(255,255,255,.15)';
}

function showVtxt(text,col){
  var el=document.getElementById('vw')||document.getElementById('vw');
  if(!el)return;
  el.textContent=text;
  el.style.color=col||'var(--color-text-secondary)';
  el.style.fontWeight=text?'600':'normal';
}


// ============ LIVE DATA TABS ============
var tabLoaded={C:false,I:false,J:false,Pip:false};

function swTab(el){
  document.querySelectorAll('.tb').forEach(function(t){t.classList.remove('act');});
  el.classList.add('act');
  var map={'c':'tabC','i':'tabI','j':'tabJ','p':'tabPip','pr':'tabPr'};
  ['tabC','tabI','tabJ','tabPip','tabPr'].forEach(function(id){
    var e=document.getElementById(id);if(e)e.style.display='none';
  });
  var t=map[el.dataset.tab];
  if(t){var e=document.getElementById(t);if(e)e.style.display='';}
  // Load live data on first open
  if(el.dataset.tab==='c'&&!tabLoaded.C) loadTab('C','/.netlify/functions/consciousness', renderConsciousness);
  if(el.dataset.tab==='i'&&!tabLoaded.I) loadTab('I','/.netlify/functions/insights', renderInsights);
  if(el.dataset.tab==='j'&&!tabLoaded.J) loadTab('J','/.netlify/functions/calendar', renderCalendar);
  if(el.dataset.tab==='p'&&!tabLoaded.Pip) loadTab('Pip','/.netlify/functions/pipeline', renderPipeline);
}

async function loadTab(key, url, renderer){
  var divMap={C:'tabC',I:'tabI',J:'tabJ',Pip:'tabPip'};
  var div=document.getElementById(divMap[key]);
  if(!div)return;
  div.innerHTML='<div class="ld-load">טוען מ-Notion... 🔄</div>';
  try{
    var res=await fetch(url);
    var data=await res.json();
    tabLoaded[key]=true;
    renderer(div,data);
  }catch(e){
    div.innerHTML='<div class="ld-err">❌ שגיאה: '+e.message+'</div>';
  }
}

function renderConsciousness(div, data){
  if(data.error){div.innerHTML='<div class="ld-err">❌ '+data.error+'</div>';return;}
  var lines=data.lines||[];
  if(!lines.length){div.innerHTML='<div class="ld-err">אין תוכן בדף התודעה</div>';return;}
  div.innerHTML=lines.filter(function(l){return l.trim()&&!l.startsWith('---');}).map(function(l){
    var isH=l.startsWith('##');
    return '<div class="ld-item"><div class="ld-title" style="'+(isH?'color:#7B6FFF;font-size:13px;':'')+'">'+l.replace(/^#+\s*/,'')+'</div></div>';
  }).join('');
}

function renderInsights(div, data){
  if(data.error){div.innerHTML='<div class="ld-err">❌ '+data.error+'</div>';return;}
  var ins=data.insights||[];
  if(!ins.length){div.innerHTML='<div class="ld-err">אין תובנות עדיין</div>';return;}
  div.innerHTML=ins.map(function(i){
    return '<div class="ld-item"><div class="ld-title">'+i.title+'</div><div class="ld-sub">'+i.created+'</div></div>';
  }).join('');
}

function renderCalendar(div, data){
  if(data.error&&(!data.events||!data.events.length)){
    div.innerHTML='<div class="ld-err">❌ '+data.error+'<br><small>Add GCAL_ICAL_URL to Netlify env vars</small></div>';return;
  }
  var evts=data.events||[];
  if(!evts.length){div.innerHTML='<div class="ld-item"><div class="ld-title" style="color:rgba(255,255,255,.4)">אין אירועים היום ומחר</div></div>';return;}
  var today=evts.filter(function(e){return e.day==='Today';});
  var tmrw=evts.filter(function(e){return e.day==='Tomorrow';});
  var html2='';
  if(today.length) html2+='<div class="ld-sub" style="margin-bottom:4px;color:#7B6FFF;">היום</div>'+today.map(function(e){return '<div class="ld-item"><div class="ld-title">'+e.summary+'</div><div class="ld-sub">'+e.time+'</div></div>';}).join('');
  if(tmrw.length) html2+='<div class="ld-sub" style="margin:8px 0 4px;color:#507080;">מחר</div>'+tmrw.map(function(e){return '<div class="ld-item"><div class="ld-title">'+e.summary+'</div><div class="ld-sub">'+e.time+'</div></div>';}).join('');
  div.innerHTML=html2;
}

function renderPipeline(div, data){
  if(data.error){div.innerHTML='<div class="ld-err">❌ '+data.error+'</div>';return;}
  var deals=data.deals||[];
  // Update metrics
  if(data.totalPipeline){
    var mv2=document.getElementById('mv2');
    if(mv2){var v=data.totalPipeline;mv2.textContent=v>=1000000?(v/1000000).toFixed(1)+'M':v>=1000?Math.round(v/1000)+'K':v;}
  }
  if(data.hot){var mv3=document.getElementById('mv3');if(mv3)mv3.textContent=data.hot;}
  if(data.leads){var mv4=document.getElementById('mv4');if(mv4)mv4.textContent=data.leads;}
  if(!deals.length){div.innerHTML='<div class="ld-err">אין עסקאות בפייפליין</div>';return;}
  div.innerHTML=deals.slice(0,15).map(function(d){
    var val=d.value?'<span class="ld-val">₪'+d.value.toLocaleString()+'</span>':'';
    return '<div class="ld-item"><div class="ld-title" style="display:flex;justify-content:space-between;">'+
      '<span>'+d.name+'</span>'+val+'</div>'+
      (d.status?'<div class="ld-sub">'+d.status+'</div>':'')+'</div>';
  }).join('');
}

// Auto-load pipeline on start to update metrics
setTimeout(function(){
  try{
    fetch('/.netlify/functions/pipeline')
      .then(function(r){return r.json();})
      .then(function(data){
        var d=document.createElement('div');
        renderPipeline(d,data); // updates metrics as side effect
      })
      .catch(function(){});// silent fail - don't break chat
  }catch(e){}
},2000);


// ============ CHAT — sendMsg + addMsg (required by buttons) ============
function addMsg(text, role){
  var m=document.getElementById('msgs');
  if(!m)return;
  var d=document.createElement('div');
  d.className='msg '+role;
  d.textContent=text;
  m.appendChild(d);
  m.scrollTop=m.scrollHeight;
}

async function sendMsg(){
  var ci=document.getElementById('ci');
  var msg=(ci?ci.value:'').trim();
  if(!msg)return;
  if(ci)ci.value='';
  showVtxt('','');
  addMsg(msg,'u');
  setFaceState('thinking');
  try{
    var res=await fetch('/.netlify/functions/ask',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg})
    });
    var data=await res.json();
    var reply=data.reply||data.error||'אין תגובה';
    addMsg(reply,'a');
    speakText(reply);
  }catch(e){
    addMsg('שגיאת חיבור: '+e.message,'a');
    setFaceState('idle');
  }
}
