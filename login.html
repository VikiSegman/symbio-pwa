<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Symbio — Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background: #08091A; color: #fff;
font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
.container { width: 100%; max-width: 420px; padding: 20px; }
.logo { text-align: center; font-size: 1.4rem; font-weight: 700; letter-spacing: 0.2em; color: #fff; margin-bottom: 8px; }
.tagline { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 40px; }
.card { background: #111; border: 1px solid #1e1e1e; border-radius: 16px; padding: 32px; }
.tabs { display: flex; gap: 0; margin-bottom: 28px; background: #0a0a0a; border-radius: 8px; padding: 4px; }
.tab { flex: 1; padding: 8px; text-align: center; font-size: 0.85rem; cursor: pointer; border-radius: 6px; color: #666; transition: all 0.2s; }
.tab.active { background: #7B6FFF; color: #fff; font-weight: 600; }
.form-group { margin-bottom: 16px; }
label { display: block; font-size: 0.78rem; color: #888; margin-bottom: 6px; }
.input-wrap { position: relative; }
input {
width: 100%; padding: 11px 40px 11px 14px;
background: #0a0a0a; border: 1px solid #222; border-radius: 8px;
color: #fff; font-size: 0.9rem; outline: none; transition: border-color 0.2s;
}
input:focus { border-color: #7B6FFF; }
.eye-btn {
position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
background: none; border: none; color: #555; cursor: pointer; font-size: 1rem; padding: 2px;
}
.eye-btn:hover { color: #aaa; }
.row { display: flex; gap: 12px; }
.row .form-group { flex: 1; }
.btn {
width: 100%; padding: 13px; background: #7B6FFF; color: #fff;
border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
cursor: pointer; margin-top: 8px; transition: background 0.2s, transform 0.1s;
}
.btn:hover { background: #6a5fe8; }
.btn:active { transform: scale(0.98); }
.btn:disabled { background: #333; cursor: not-allowed; }
.btn-google {
width: 100%; padding: 11px; background: #fff; color: #333;
border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600;
cursor: pointer; margin-top: 8px; display: flex; align-items: center;
justify-content: center; gap: 8px; transition: background 0.2s;
}
.btn-google:hover { background: #f5f5f5; }
.error { color: #ff6b6b; font-size: 0.8rem; margin-top: 12px; text-align: center; min-height: 20px; }
.success { color: #4ade80; font-size: 0.85rem; margin-top: 12px; text-align: center; min-height: 20px; }
.divider { text-align: center; color: #444; font-size: 0.75rem; margin: 14px 0 2px; }
.pricing-link { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #666; }
.pricing-link a { color: #7B6FFF; text-decoration: none; }
</style>
</head>
<body>
<div class="container">
<div class="logo">SYMBIO</div>
<div class="tagline">Your second brain. Always on.</div>

<div class="card">
<div class="tabs">
<div class="tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
<div class="tab" id="tab-signup" onclick="switchTab('signup')">Create Account</div>
</div>

<!-- LOGIN FORM -->
<div id="form-login">
<div class="form-group">
<label>Email</label>
<input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
</div>
<div class="form-group">
<label>Password</label>
<div class="input-wrap">
<input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password">
<button class="eye-btn" onclick="togglePwd('login-password',this)" tabindex="-1">👁</button>
</div>
</div>
<button class="btn" id="login-btn" onclick="doLogin()">Sign In →</button>
<div class="divider">— or —</div>
<button class="btn-google" onclick="doGoogle()">
<svg width="18" height="18" viewBox="0 0 48 48">
<path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
<path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
<path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
<path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
</svg>
Continue with Google
</button>
<div class="error" id="login-error"></div>
</div>

<!-- SIGNUP FORM -->
<div id="form-signup" style="display:none">
<div class="row">
<div class="form-group">
<label>First Name</label>
<input type="text" id="signup-first" placeholder="John">
</div>
<div class="form-group">
<label>Last Name</label>
<input type="text" id="signup-last" placeholder="Smith">
</div>
</div>
<div class="row">
<div class="form-group">
<label>Country</label>
<input type="text" id="signup-country" placeholder="Israel">
</div>
<div class="form-group">
<label>City</label>
<input type="text" id="signup-city" placeholder="Tel Aviv">
</div>
</div>
<div class="form-group">
<label>Email</label>
<input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
</div>
<div class="form-group">
<label>Password</label>
<div class="input-wrap">
<input type="password" id="signup-password" placeholder="Min 8 characters" autocomplete="new-password">
<button class="eye-btn" onclick="togglePwd('signup-password',this)" tabindex="-1">👁</button>
</div>
</div>
<div class="form-group">
<label>Confirm Password</label>
<div class="input-wrap">
<input type="password" id="signup-confirm" placeholder="Repeat password" autocomplete="new-password">
<button class="eye-btn" onclick="togglePwd('signup-confirm',this)" tabindex="-1">👁</button>
</div>
</div>
<button class="btn" id="signup-btn" onclick="doSignup()">Create My Symbio →</button>
<div class="success" id="signup-success"></div>
<div class="error" id="signup-error"></div>
</div>
</div>

<div class="pricing-link">Don't have an account? <a href="/pricing.html">See plans →</a></div>
</div>

<script>
function switchTab(tab) {
document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
document.getElementById('tab-login').classList.toggle('active', tab === 'login');
document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
}

function togglePwd(id, btn) {
const el = document.getElementById(id);
el.type = el.type === 'password' ? 'text' : 'password';
btn.textContent = el.type === 'password' ? '👁' : '🙈';
}

window.addEventListener('load', () => {
if (localStorage.getItem('symbio_session') && localStorage.getItem('symbio_user_id')) {
window.location.href = '/';
}
if (document.referrer.includes('pricing')) switchTab('signup');
});

async function doGoogle() {
// Fetch Supabase URL from server config — no keys in source
const cfg = await fetch('/.netlify/functions/config').then(r => r.json());
const redirectTo = encodeURIComponent(window.location.origin + '/auth-callback.html');
window.location.href = `${cfg.supabaseUrl}/auth/v1/authorize?provider=google&redirect_to=${redirectTo}`;
}

async function doLogin() {
const email = document.getElementById('login-email').value.trim();
const password = document.getElementById('login-password').value;
const errEl = document.getElementById('login-error');
const btn = document.getElementById('login-btn');

errEl.textContent = '';
if (!email || !password) { errEl.textContent = 'Please enter email and password.'; return; }

btn.disabled = true; btn.textContent = 'Signing in...';

try {
const res = await fetch('/.netlify/functions/auth', {
method: 'POST', headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ action: 'login', email, password })
});
const data = await res.json();

if (data.error) {
errEl.textContent = data.error;
btn.disabled = false; btn.textContent = 'Sign In →';
return;
}

localStorage.setItem('symbio_user_id', data.userId || email);
localStorage.setItem('symbio_first_name', data.firstName || '');
localStorage.setItem('symbio_tier', data.tier || 'starter');
localStorage.setItem('symbio_session', JSON.stringify(data.session));
window.location.href = '/';

} catch (err) {
errEl.textContent = 'Connection error. Please try again.';
btn.disabled = false; btn.textContent = 'Sign In →';
}
}

async function doSignup() {
const firstName = document.getElementById('signup-first').value.trim();
const lastName = document.getElementById('signup-last').value.trim();
const country = document.getElementById('signup-country').value.trim();
const city = document.getElementById('signup-city').value.trim();
const email = document.getElementById('signup-email').value.trim();
const password = document.getElementById('signup-password').value;
const confirm = document.getElementById('signup-confirm').value;
const errEl = document.getElementById('signup-error');
const sucEl = document.getElementById('signup-success');
const btn = document.getElementById('signup-btn');

errEl.textContent = ''; sucEl.textContent = '';

if (!firstName || !lastName || !email || !password) {
errEl.textContent = 'First name, last name, email and password are required.'; return;
}
if (password.length < 8) { errEl.textContent = 'Password must be at least 8 characters.'; return; }
if (password !== confirm) { errEl.textContent = 'Passwords do not match.'; return; }

btn.disabled = true; btn.textContent = 'Creating your Symbio...';

try {
const res = await fetch('/.netlify/functions/auth', {
method: 'POST', headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ action: 'signup', email, password, firstName, lastName, country, city })
});
const data = await res.json();

if (data.error) {
errEl.textContent = data.error;
btn.disabled = false; btn.textContent = 'Create My Symbio →';
return;
}

localStorage.setItem('symbio_user_id', data.userId);
localStorage.setItem('symbio_first_name', firstName);
localStorage.setItem('symbio_tier', 'starter');
localStorage.setItem('symbio_session', JSON.stringify(data.session));

sucEl.textContent = '✅ Account created! Loading your Symbio...';
setTimeout(() => { window.location.href = '/'; }, 1200);

} catch (err) {
errEl.textContent = 'Connection error. Please try again.';
btn.disabled = false; btn.textContent = 'Create My Symbio →';
}
}

document.addEventListener('keydown', (e) => {
if (e.key !== 'Enter') return;
const loginVisible = document.getElementById('form-login').style.display !== 'none';
if (loginVisible) doLogin(); else doSignup();
});
</script>
</body>
</html>
